<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Water Filter Cone Calculator</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Space+Mono|Muli">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.1.2/lib/p5.min.js"></script>

    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .flex-item {
            width: 100%;
        }

        h1 {
            background-color: rgb(0, 121, 201);
            margin: -8px;
            font-size: 5vh;
            font-family: "Space Mono", "Lucida Console", "Courier New", monospace;
            text-align: center;
            color: white;
        }

        p {
            font-family: Muli, sans-serif;
        }

        input {
            font-family: Muli, monospace;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>

</head>

<body>
    <h1 style="width: 100vw;">Water Filter Cone Calculator</h1>

    <br>
    <div class="flex-container">
        <div class="flex-item" id="textSide">
            <p style="padding-bottom: 10px;">This is a website to find the volume and surface area of a cone packaging a
                water filter.</p>

            <p style="margin-left: 50px;">Enter height (in.): </p>
            <input type="number" id="waterFilterHeight" style="margin-left: 100px;">
            <p style="margin-left: 50px;">Enter <i>r</i><sub>1</sub> (in.): </p>
            <input type="number" id="r1" style="margin-left: 100px;">
            <p style="margin-left: 50px;">Enter <i>r</i><sub>2</sub> (in.): </p>
            <input type="number" id="r2" style="margin-left: 100px;">

            <br>
            <button
                style="float: right; margin: 5% 2.5%; border: 0cap; border-radius: 25px; width: 95%; font: 4vh 'Space Mono', Muli, monospace; color: white; background-color: rgb(0, 121, 201);"
                onclick="setInitialStoredValues(); calculateSum(); storeValuesInSessionStorage(); showImage();">Calculate</button>

            <p style="padding-top: 100px;">Cone Height: <span id="cone-height-display"></span></p>
            <p>Cone Base Area: <span id="cone-base-area-display"></span></p>
            <p>Volume: <span id="volume-display"></span></p>
        </div>

        <div class="flex-item" id="diagramSide" style="display: none;">
            <script src="diagram.js"></script>
        </div>
    </div>

    <br>

    <script>
        function showImage() {
            document.getElementById("diagramSide").style.display = "inline";

            if (window.innerWidth > 600) {
                document.getElementsByClassName("flex-item")[0].style.width = "50%";
                document.getElementsByClassName("flex-item")[1].style.width = "50%";
            }
        }

        const storedValues = {
            h: "",
            r1: "",
            r2: "",
            H: "",

            textSideHeight: "",

            set calculatedh(h) {
                this.h = h;
            },

            set calculatedR1(r1) {
                this.r1 = r1;
            },

            set calculatedR2(r2) {
                this.r2 = r2;
            },

            set calculatedH(H) {
                this.H = H;
            },

            set foundTextSideHeight(textSideHeight) {
                this.textSideHeight = textSideHeight;
            }
        };

        function setInitialStoredValues() {
            storedValues.calculatedh = document.getElementById('waterFilterHeight').value;
            storedValues.calculatedR1 = document.getElementById('r1').value;
            storedValues.calculatedR2 = document.getElementById('r2').value;

            storedValues.foundTextSideHeight = document.getElementById("textSide").clientHeight;
        }

        function storeValuesInSessionStorage() {
            const storedValuesString = JSON.stringify(storedValues);
            sessionStorage.setItem("storedValuesString", storedValuesString);
        }

        function calculateSum() {
            const h = storedValues.h;
            const r1 = storedValues.r1;
            const r2 = storedValues.r2;

            const H = h * r1 / (r1 - r2);
            storedValues.calculatedH = H;
            const B = Math.PI * (r1 / 2) ** 2;
            const V = B * H * (1 / 3);

            document.getElementById('cone-height-display').textContent = H;
            document.getElementById('cone-base-area-display').textContent = B;
            document.getElementById('volume-display').textContent = V;
        }

    </script>
</body>

</html>
