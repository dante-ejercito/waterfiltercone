<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Filter Cone Diagram</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Space+Mono|Muli">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.1.2/lib/p5.min.js"></script>

    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
        }

        .flex-item {
            width: 50%;
        }

        @media (max-width: 1000px) {
            .flex-item {
                width: 100%;
            }
        }

        h1 {
            background-color: rgb(0, 121, 201);
            margin: -10px -10px 0px;
            padding: 25px;
            font-size: 5vh;
            font-family: "Space Mono", "Lucida Console", "Courier New", monospace;
            text-align: center;
            color: white;
        }

        p {
            font-family: "Muli", sans-serif;
        }
    </style>

</head>

<body>
    <h1>Water Filter Cone Calculater</h1>

    <div class="flex-container">
        <div class="flex-item">
            <p style="padding-bottom: 10px;">This is a website to find the volume and surface area of a cone packaging a
                water filter.</p>

            <p style="margin-left: 50px;">Enter height (in.): </p>
            <input type="number" id="waterFilterHeight" style="margin-left: 100px;">
            <p style="margin-left: 50px;">Enter <i>d</i><sub>1</sub> (in.): </p>
            <input type="number" id="d1" style="margin-left: 100px;">
            <p style="margin-left: 50px;">Enter <i>d</i><sub>2</sub> (in.): </p>
            <input type="number" id="d2" style="margin-left: 100px;">

            <br>
            <button
                style="float: right; margin: 2.5%; border: 0cap; border-radius: 25px; width: 95%; font-size: 5vh; color: white; background-color: rgb(0, 121, 201);"
                onclick="calculateSum(); storeValuesInSessionStorage();">Calculate</button>

            <p style="padding-top: 100px;">Cone Height: <span id="cone-height-display"></span></p>
            <p>Cone Base Area: <span id="cone-base-area-display"></span></p>
            <p>Volume: <span id="volume-display"></span></p>
        </div>

        <div class="flex-item" id="diagramSide">
            <script src="diagram.js"></script>
        </div>
    </div>

    <script>
        const storedValues = {
            h: "",
            d1: "",
            d2: "",
            H: "",

            set calculatedh(h) {
                this.h = h;
            },

            set calculatedd1(d1) {
                this.d1 = d1;
            },

            set calculatedd2(d2) {
                this.d2 = d2;
            },

            set calculatedH(H) {
                this.H = H;
            }
        };

        function setInitialStoredValues() {
            //alert(document.getElementById('waterFilterHeight').value);
            storedValues.calculatedh = document.getElementById('waterFilterHeight').value;
            storedValues.calculatedd1 = document.getElementById('d1').value;
            storedValues.calculatedd2 = document.getElementById('d2').value;
        }

        function storeValuesInSessionStorage() {
            const storedValuesString = JSON.stringify(storedValues);
            sessionStorage.setItem("storedValuesString", storedValuesString);
        }

        function calculateSum() {
            setInitialStoredValues();

            const h = storedValues.h;
            const d1 = storedValues.d1;
            const d2 = storedValues.d2;

            const H = h * d1 / (d1 - d2);
            storedValues.calculatedH = H;
            const B = Math.PI * (d1 / 2) ** 2;
            const V = B * H * (1 / 3);

            document.getElementById('cone-height-display').textContent = H;
            document.getElementById('cone-base-area-display').textContent = B;
            document.getElementById('volume-display').textContent = V;
        }

    </script>
</body>

</html>
